apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: nushan2000/notification-service:latest
          ports:
            - containerPort: 5002
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
            - name: PORT
              value: "5002"
            - name: ORIGIN
              value: "http://localhost:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
