apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nushan2000/saloneappointmentsystem-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_USER_SERVICE_URL
              value: "http://api-gateway:4000/auth"
            - name: REACT_APP_APPOINTMENT_SERVICE_URL
              value: "http://api-gateway:4000/appointments"
            - name: REACT_APP_NOTIFICATION_SERVICE_URL
              value: "http://api-gateway:4000/notifications"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
