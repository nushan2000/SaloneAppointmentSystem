version: '3.9'

services:
  # Kafka (Bitnami KRaft mode, no Zookeeper)
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CLUSTER_ID=kraft-cluster-12345
    networks:
      - app-net

  # MongoDB
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-net

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: nushanhansana
      KAFKA_BROKER: kafka:9092
      MONGO_URI_AUTH: mongodb://mongodb:27017/salone
      ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
      - kafka
    networks:
      - app-net

  # Appointment Service
  appointment-service:
    build: ./appointment-service
    container_name: appointment-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      MONGO_URI_APPOINTMENTS: mongodb://mongodb:27017/salone
      KAFKA_BROKER: kafka:9092
      ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
      - kafka
    networks:
      - app-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      KAFKA_BROKER: kafka:9092
      ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
      - kafka
    networks:
      - app-net

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - appointment-service
    networks:
      - app-net

  # Frontend
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_USER_SERVICE_URL: http://localhost:4000/auth
        REACT_APP_APPOINTMENT_SERVICE_URL: http://localhost:4000/appointments
        REACT_APP_NOTIFICATION_SERVICE_URL: http://localhost:4000/notifications
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - app-net

# Docker network
networks:
  app-net:
    driver: bridge

# Volumes
volumes:
  mongo-data:
