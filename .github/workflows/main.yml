name: Build and Push Microservices to Docker Hub

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend,api-gateway, auth-service, appointment-service, notification-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          echo "Building service: ${{ matrix.service }}"
          docker build -t nushan2000/saloneappointmentsystem-${{ matrix.service }} ./${{ matrix.service }}
          docker push nushan2000/saloneappointmentsystem-${{ matrix.service }}
